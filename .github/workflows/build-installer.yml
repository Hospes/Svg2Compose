name: Build and Release Windows Executables

on:
  push:
    tags: 
        - 'v?[0-9]+.[0-9]+.[0-9]+'  # Trigger on tags like 1.0.0, 2.5.10 or v1.2.3
    branches: 
        - 'release/**'  # Push events to branches matching refs/heads/release/10
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package for Windows x64
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.action == 'published' && github.event.release.tag_name != '')
    runs-on: [self-hosted, windows, x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'oracle'
        architecture: x64

    - name: Set up cache
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build with Gradle
      run: ./gradlew :app:packageMsi

    - name: Locate Generated Executables
      id: locate_files
      shell: powershell
      run: |
        # Find the .msi file in the build output directory
        $msiFile = Get-ChildItem -Path "app/build/compose/binaries" -Recurse -Filter "*.msi" | Select-Object -First 1
        if ($null -eq $msiFile) {
          Write-Error "Could not find the generated .msi file."
          exit 1
        }
        Write-Host "Found MSI: $($msiFile.FullName)"
        echo "msi_path=$($msiFile.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        echo "msi_name=$($msiFile.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    # The following steps for uploading will ONLY run if the workflow was triggered
    # by a 'published' release event. For tag pushes or manual runs, they will be skipped.
    - name: Upload .MSI to Release
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ${{ steps.locate_files.outputs.msi_path }}
        asset_name: ${{ steps.locate_files.outputs.msi_name }}
        asset_content_type: application/x-msi