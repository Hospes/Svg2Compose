name: Build and Release Windows Executables

on:
  push:
    tags: 
        - 'v?[0-9]+.[0-9]+.[0-9]+'  # Trigger on tags like 1.0.0, 2.5.10 or v1.2.3
    branches: 
        - 'release/**'  # Push events to branches matching refs/heads/release/10
  workflow_dispatch:

jobs:
  build:
    name: Build and Package for Windows x64
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, windows, x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'oracle'
        architecture: x64

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-read-only: false
        gradle-home-cache-cleanup: true

    - name: Build with Gradle
      run: ./gradlew :app:packageReleaseMsi

    - name: Locate Generated Executables
      id: locate_files
      shell: powershell
      run: |
        # Find the .msi file in the build output directory
        $msiFile = Get-ChildItem -Path "app/build/compose/binaries" -Recurse -Filter "*.msi" | Select-Object -First 1
        if ($null -eq $msiFile) {
          Write-Error "Could not find the generated .msi file."
          exit 1
        }
        Write-Host "Found MSI: $($msiFile.FullName)"
        echo "msi_path=$($msiFile.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        echo "msi_name=$($msiFile.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    # Create GitHub release with MSI package when triggered by tag push
    - name: Create GitHub Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      shell: powershell
      run: |
        $tagName = "${{ github.ref_name }}"
        $msiPath = "${{ steps.locate_files.outputs.msi_path }}"
        
        # Create release with MSI attached
        gh release create $tagName `
          --title "$tagName" `
          --generate-notes `
          "$msiPath"
        
        Write-Host "Created release $tagName with MSI package"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Cleanup artifacts from old releases - keep artifacts only for the last 3 releases
    - name: Cleanup Old Release Artifacts
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      shell: powershell
      run: |
        Write-Host "Cleaning up artifacts from old releases, keeping artifacts only for the last 3 releases..."
        
        # Get all releases sorted by creation date (newest first)
        $releases = gh release list --json tagName,createdAt --limit 50 | ConvertFrom-Json
        $sortedReleases = $releases | Sort-Object { [DateTime]$_.createdAt } -Descending
        
        # Skip the first 3 (keep their artifacts) and remove artifacts from the rest
        $releasesToCleanup = $sortedReleases | Select-Object -Skip 3
        
        foreach ($release in $releasesToCleanup) {
          Write-Host "Removing artifacts from release: $($release.tagName)"
          
          # Get all assets for this release
          $assets = gh release view $($release.tagName) --json assets | ConvertFrom-Json
          
          # Delete each asset
          foreach ($asset in $assets.assets) {
            Write-Host "  - Deleting asset: $($asset.name)"
            gh release delete-asset $($release.tagName) $($asset.name) --yes
          }
        }
        
        Write-Host "Cleanup completed. Kept artifacts only for latest 3 releases."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}