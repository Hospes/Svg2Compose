[versions]
kotlin = "2.2.0"
kotlinx-serialization = "1.9.0"
kotlinx-coroutines = "1.10.2"
compose = "1.9.0-alpha03"
ksp = "2.2.0-2.0.2"
kotlininject = "0.8.0"
kotlininject-anvil = "0.1.6"
kotlininject-viewmodel = "0.3.0"
androidx-lifecycle = "2.9.1"
androidx-navigation = "2.9.0-beta03"
log4k = "1.4.1"
multiplatformsettings = "1.3.0"
ksoup = "0.2.4"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
build-config = { id = "com.github.gmazzo.buildconfig", version = "5.6.7" }

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.4.1" }
kotlinx-atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version = "0.20.2" }

kotlininject-compiler = { module = "me.tatarka.inject:kotlin-inject-compiler-ksp", version.ref = "kotlininject" }
kotlininject-runtime = { module = "me.tatarka.inject:kotlin-inject-runtime", version.ref = "kotlininject" }
kotlininject-anvil-compiler = { module = "software.amazon.lastmile.kotlin.inject.anvil:compiler", version.ref = "kotlininject-anvil" }
kotlininject-anvil-runtime = { module = "software.amazon.lastmile.kotlin.inject.anvil:runtime", version.ref = "kotlininject-anvil" }
kotlininject-anvil-runtime-optional = { module = "software.amazon.lastmile.kotlin.inject.anvil:runtime-optional", version.ref = "kotlininject-anvil" }
kotlininject-viewmodel-compiler = { module = "com.teobaranga.kotlin.inject.viewmodel:compiler", version.ref = "kotlininject-viewmodel" }
kotlininject-viewmodel-runtime = { module = "com.teobaranga.kotlin.inject.viewmodel:runtime", version.ref = "kotlininject-viewmodel" }
kotlininject-viewmodel-compose = { module = "com.teobaranga.kotlin.inject.viewmodel:runtime-compose", version.ref = "kotlininject-viewmodel" }

androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }

# Multiplatform logging
log4k = { group = "de.peilicke.sascha", name = "log4k", version.ref = "log4k" }
log4k-slf4j = { group = "de.peilicke.sascha", name = "log4k-slf4j", version.ref = "log4k" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.5.16" }

multiplatformsettings-core = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatformsettings" }
multiplatformsettings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatformsettings" }

fleeksoft-ksoup = { module = "com.fleeksoft.ksoup:ksoup-okio", version.ref = "ksoup" }